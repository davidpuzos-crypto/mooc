<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évaluation Candidats — Soft Skills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        accent: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .skill-btn { transition: all 0.2s ease; }
        .skill-btn:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .badge-count {
            min-width: 1.5rem;
            transition: transform 0.15s ease;
        }
        .badge-count.bump {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold tracking-tight">Recrutement — Soft Skills</h1>
            <p class="mt-1 text-indigo-200 text-sm">Evaluation des savoir-etre par l'observation en situation</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

        <!-- Section 1 : Inscription candidat -->
        <section id="section-inscription" class="bg-white rounded-2xl shadow-md p-6 fade-in">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                <span class="bg-indigo-100 text-indigo-700 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold">1</span>
                Inscription du candidat
            </h2>
            <form id="form-candidat" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                        <input type="text" id="nom" name="nom" required
                            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                            placeholder="Dupont">
                    </div>
                    <div>
                        <label for="prenom" class="block text-sm font-medium text-gray-700 mb-1">Prenom</label>
                        <input type="text" id="prenom" name="prenom" required
                            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                            placeholder="Marie">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="marie.dupont@email.com">
                </div>
                <div>
                    <label for="lien-16p" class="block text-sm font-medium text-gray-700 mb-1">Lien du resultat 16 Personalities</label>
                    <input type="url" id="lien-16p" name="lien16p"
                        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="https://www.16personalities.com/profiles/...">
                    <p class="text-xs text-gray-400 mt-1">Collez ici le lien de votre profil 16 Personalities</p>
                </div>
                <button type="submit" id="btn-inscrire"
                    class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg shadow transition">
                    Inscrire le candidat
                </button>
            </form>
            <div id="msg-inscription" class="mt-4 hidden"></div>
        </section>

        <!-- Section 2 : Observation -->
        <section id="section-observation" class="bg-white rounded-2xl shadow-md p-6 fade-in hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-2 flex items-center gap-2">
                <span class="bg-purple-100 text-purple-700 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold">2</span>
                Observation — Session de jeu
            </h2>
            <p id="candidat-actif" class="text-sm text-gray-500 mb-6"></p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="grille-competences">
                <!-- Les boutons seront generes par app.js -->
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-3">
                <button id="btn-enregistrer"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-lg shadow transition">
                    Enregistrer l'observation
                </button>
                <button id="btn-reinitialiser"
                    class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-6 py-3 rounded-lg shadow transition">
                    Reinitialiser les scores
                </button>
            </div>
            <div id="msg-observation" class="mt-4 hidden"></div>
        </section>

        <!-- Section 3 : Recapitulatif -->
        <section id="section-recap" class="bg-white rounded-2xl shadow-md p-6 fade-in hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                <span class="bg-green-100 text-green-700 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold">3</span>
                Recapitulatif
            </h2>
            <div id="recap-contenu" class="space-y-2 text-sm text-gray-700"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 py-6">
        Application de recrutement par les soft skills &copy; 2026
    </footer>

    <!-- Firebase SDK (compat pour script classique) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
